<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario</title>
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { --navy: #14213D; --ac: #E08A2E; --fg: #E9ECF2; }
  html, body { margin: 0; height: 100%; background: var(--navy); overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #F4F2EC; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--navy); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .35s; z-index: 2; text-align: center; padding: 0 24px; }
  #splash img { width: 84px; height: 84px; border-radius: 20px; }
  #splash b { font-size: 19px; color: #fff; }
  #splash .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: var(--ac); border-radius: 4px; animation: mv 1.1s ease-in-out infinite; }
  #splash small { color: #9FB0CC; max-width: 340px; }
  #splash a { color: var(--ac); }
  @keyframes mv { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  .off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b id="tt">Inventario</b><div class="bar"><i></i></div><small id="msg">Abriendo el sistema…</small></div>
<iframe id="app" title="Inventario" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; geolocation"></iframe>
<script src="config.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), g = q.has('gestion');
  var aqui = location.origin + location.pathname.replace(/index\.html$/, '');
  document.title = g ? 'Gestión de Inventario' : 'Conteo · Inventario';
  document.getElementById('tt').textContent = g ? 'Gestión de Inventario' : 'Conteo físico';
  var src = window.EXEC_URL + '?' + (g ? 'gestion&' : '') + 'shell=' + encodeURIComponent(aqui);
  var f = document.getElementById('app'), sp = document.getElementById('splash'), listo = false;
  f.addEventListener('load', function () { listo = true; sp.classList.add('off'); });
  f.src = src;
  setTimeout(function () {
    if (listo) return;
    document.getElementById('msg').innerHTML = 'Está tardando más de lo normal. Revise su conexión o <a href="' + src.replace(/&?shell=[^&]*/, '') + '" target="_top">abra el sistema directo</a>.';
  }, 20000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
